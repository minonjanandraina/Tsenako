name: Publication

# Publie un APK signé quand une étiquette de version est poussée : git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Secrets du dépôt : TSENA_KEYSTORE_BASE64 (fichier .jks en base64), TSENA_KEYSTORE_PASSWORD,
      # TSENA_KEY_ALIAS, TSENA_KEY_PASSWORD
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.TSENA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=Signature::Secret TSENA_KEYSTORE_BASE64 absent (voir Claude.md, Publication)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tsena.jks"
          echo "TSENA_KEYSTORE=$RUNNER_TEMP/tsena.jks" >> "$GITHUB_ENV"

      - name: Tests et APK signé
        env:
          TSENA_KEYSTORE_PASSWORD: ${{ secrets.TSENA_KEYSTORE_PASSWORD }}
          TSENA_KEY_ALIAS: ${{ secrets.TSENA_KEY_ALIAS }}
          TSENA_KEY_PASSWORD: ${{ secrets.TSENA_KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "tsena-${GITHUB_REF_NAME}.apk"

      - name: Version GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: tsena-${{ github.ref_name }}.apk
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: schemas-room
          path: app/schemas/
